name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  static-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Vite app bundle
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const app = fs.readFileSync('src/App.jsx', 'utf8');
          const required = [
            ['index.html', html, 'id="dubi-html"'],
            ['index.html', html, 'type="module" src="/src/main.jsx"'],
            ['src/App.jsx', app, 'function applyDir'],
            ['src/App.jsx', app, 'FINAL_AUDIT_TRANSLATIONS'],
            ['src/App.jsx', app, 'WearableProvider'],
            ['src/App.jsx', app, 'AllergyChipPicker'],
            ['src/App.jsx', app, 'SportChipPicker'],
            ['src/App.jsx', app, 'authorizeWearableProviderInBackend']
          ];
          const missing = required
            .filter(([, content, needle]) => !content.includes(needle))
            .map(([file, , needle]) => `${file}: ${needle}`);
          if (missing.length) {
            console.error('Missing required frontend markers:', missing.join(', '));
            process.exit(1);
          }
          console.log('Frontend Vite smoke check passed.');
          NODE

      - name: Build mobile web assets
        run: pnpm run build:web

      - name: Reject frontend ingredient-name substitutions
        run: node scripts/test-no-name-substitution.mjs

      - name: Goal rules match backend values (D-017a, D-033)
        run: node scripts/test-goal-macro-rules.mjs

      - name: High-risk screening (D-031, D-040, D-043)
        run: node scripts/test-high-risk-screening.mjs

      - name: Body composition texts and wiring (D-041, D-042, D-043)
        run: |
          node scripts/test-body-composition-copy.mjs
          node scripts/test-body-composition-wiring.mjs

      - name: Plan version banner, stale plan, state on server (D-038)
        run: |
          node scripts/test-plan-version.mjs
          node scripts/test-server-state.mjs
