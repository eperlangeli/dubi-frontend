name: Android Release Build

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Android versionName"
        required: true
        default: "0.1.0"
      version_code:
        description: "Android versionCode"
        required: true
        default: "1"

jobs:
  android-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Capacitor web assets
        run: pnpm run build:web

      - name: Sync Capacitor Android project
        run: pnpm exec cap sync android

      - name: Prepare Gradle wrapper
        run: |
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew

      - name: Build release APK and AAB
        working-directory: android
        run: >
          ./gradlew --no-daemon
          -PDUBI_VERSION_NAME=${{ inputs.version_name }}
          -PDUBI_VERSION_CODE=${{ inputs.version_code }}
          assembleRelease bundleRelease

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dubi-android-release-unsigned
          path: |
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android/app/build/outputs/bundle/release/app-release.aab
