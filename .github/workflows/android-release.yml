name: Android Release Build

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Android versionName"
        required: true
        default: "0.1.0"
      version_code:
        description: "Android versionCode"
        required: true
        default: "1"

jobs:
  android-release:
    runs-on: ubuntu-latest
    env:
      DUBI_ANDROID_KEYSTORE_BASE64: ${{ secrets.DUBI_ANDROID_KEYSTORE_BASE64 }}
      DUBI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.DUBI_ANDROID_KEYSTORE_PASSWORD }}
      DUBI_ANDROID_KEY_ALIAS: ${{ secrets.DUBI_ANDROID_KEY_ALIAS }}
      DUBI_ANDROID_KEY_PASSWORD: ${{ secrets.DUBI_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Capacitor web assets
        run: pnpm run build:web

      - name: Sync Capacitor Android project
        run: pnpm exec cap sync android

      - name: Prepare Gradle wrapper
        run: |
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew

      - name: Validate release signing secrets
        shell: bash
        run: |
          missing=0
          for name in DUBI_ANDROID_KEYSTORE_BASE64 DUBI_ANDROID_KEYSTORE_PASSWORD DUBI_ANDROID_KEY_ALIAS DUBI_ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required for signed Android release builds"
              missing=1
            fi
          done
          exit "$missing"

      - name: Decode release keystore
        shell: bash
        run: |
          printf '%s' "$DUBI_ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/dubi-upload-key.jks

      - name: Verify release keystore
        shell: bash
        run: |
          keytool -list \
            -keystore android/app/dubi-upload-key.jks \
            -storepass "$DUBI_ANDROID_KEYSTORE_PASSWORD" \
            -alias "$DUBI_ANDROID_KEY_ALIAS" \
            >/dev/null

      - name: Build signed release APK and AAB
        working-directory: android
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon \
            -PDUBI_VERSION_NAME=${{ inputs.version_name }} \
            -PDUBI_VERSION_CODE=${{ inputs.version_code }} \
            -PDUBI_ANDROID_KEYSTORE_PATH=dubi-upload-key.jks \
            -PDUBI_ANDROID_KEYSTORE_PASSWORD="${DUBI_ANDROID_KEYSTORE_PASSWORD}" \
            -PDUBI_ANDROID_KEY_ALIAS="${DUBI_ANDROID_KEY_ALIAS}" \
            -PDUBI_ANDROID_KEY_PASSWORD="${DUBI_ANDROID_KEY_PASSWORD}" \
            assembleRelease bundleRelease 2>&1 | tee ../release-gradle-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::group::Gradle release failure summary"
            grep -n -B 20 -A 140 -E "FAILURE:|What went wrong|Execution failed|Could not|Caused by:|BUILD FAILED|Keystore|keystore|password|alias" ../release-gradle-build.log || true
            echo "::endgroup::"
          fi
          exit "$status"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dubi-android-release-signed
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload release Gradle build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dubi-release-gradle-build-log
          path: release-gradle-build.log
