name: Android Debug Build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Capacitor web assets
        run: pnpm run build:web

      - name: Sync Capacitor Android project
        run: pnpm exec cap sync android

      - name: Prepare Gradle wrapper
        run: |
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee ../gradle-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::group::Gradle failure summary"
            grep -n -B 20 -A 120 -E "FAILURE:|What went wrong|Execution failed|Could not|Caused by:|BUILD FAILED" ../gradle-build.log || true
            echo "::endgroup::"
          fi
          exit "$status"

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dubi-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Gradle build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dubi-gradle-build-log
          path: gradle-build.log
