<!DOCTYPE html>
<html lang="it" dir="ltr" id="dubi-html">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#E8E4DC" />
  <meta name="application-name" content="DUBI" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="DUBI" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/dubi-icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/dubi-icon.svg" />
  <title>DUBI — Data-Driven Understanding of Body Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/src/styles.css" />

</head>
<body>

  <!-- Schermata di boot — nascosta non appena React monta il componente root -->
  <div id="dubi-boot">
    <div class="dubi-boot-logo">DUBI</div>
    <div class="dubi-boot-spinner"></div>
    <div class="dubi-boot-error" id="dubi-boot-error">
      Connessione assente o lenta.<br>
      Verifica la connessione internet e riprova.
    </div>
  </div>

  <script>
    (function localizeDubiBoot() {
      var copies = {
        it:{loading:"Caricamento in corso…",error:"Connessione assente o lenta. Verifica la connessione internet e riprova."},
        en:{loading:"Loading…",error:"Connection is unavailable or slow. Check your internet connection and try again."},
        fr:{loading:"Chargement…",error:"La connexion est indisponible ou lente. Vérifiez votre connexion Internet et réessayez."},
        es:{loading:"Cargando…",error:"La conexión no está disponible o es lenta. Verifica tu conexión a Internet e inténtalo de nuevo."},
        de:{loading:"Laden…",error:"Die Verbindung ist nicht verfügbar oder langsam. Überprüfe deine Internetverbindung und versuche es erneut."},
        ar:{loading:"جارٍ التحميل…",error:"الاتصال غير متاح أو بطيء. تحقّق من اتصالك بالإنترنت وحاول مرة أخرى."},
        pt:{loading:"A carregar…",error:"A ligação não está disponível ou está lenta. Verifica a ligação à Internet e tenta novamente."},
        zh:{loading:"加载中…",error:"连接不可用或速度较慢。请检查网络连接后重试。"},
        ja:{loading:"読み込み中…",error:"接続できないか、通信が遅くなっています。インターネット接続を確認して、もう一度お試しください。"},
        ru:{loading:"Загрузка…",error:"Соединение недоступно или работает медленно. Проверьте подключение к Интернету и повторите попытку."}
      };
      var lang = "it";
      try { lang = localStorage.getItem("dubi_lang") || "it"; } catch (error) {}
      var copy = copies[lang] || copies.en;
      var message = document.querySelector('.dubi-boot-msg');
      var errorMessage = document.getElementById('dubi-boot-error');
      if (message) message.textContent = copy.loading;
      if (errorMessage) errorMessage.textContent = copy.error;
      document.documentElement.setAttribute("lang", lang);
      document.documentElement.setAttribute("dir", lang === "ar" ? "rtl" : "ltr");
    })();

    // Mostra errore se l'app non termina l'avvio entro 12 secondi.
    window._dubiBootTimer = setTimeout(function() {
      if (!window._dubiReady) {
        var el = document.getElementById('dubi-boot-error');
        if (el) el.style.display = 'block';
        var spinner = document.querySelector('.dubi-boot-spinner');
        if (spinner) spinner.style.display = 'none';
      }
    }, 12000);
  </script>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <script>
    if ("serviceWorker" in navigator && window.location.protocol === "https:") {
      window.addEventListener("load", function() {
        navigator.serviceWorker.register("/sw.js").catch(function(error) {
          console.warn("DUBI service worker registration failed:", error);
        });
      });
    }
  </script>
</body>
</html>
